 {% extends "base.html" %}

{% block title %}{{ 'Edit Incident' if incident else 'Report Incident' }} — EventOps AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm border-0 rounded-4 overflow-hidden mb-5">
            <!-- Header -->
            <div class="card-header py-3 px-4 d-flex justify-content-between align-items-center text-white"
                 style="background: linear-gradient(135deg, #1877f2 0%, #6338e8 55%, #7c3aed 100%);">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi {{ 'bi-pencil-square' if incident else 'bi-shield-exclamation' }} fs-4"></i>
                    <h5 class="mb-0 fw-bold">{{ 'Edit Incident' if incident else 'Report New Incident' }}</h5>
                </div>
                <a href="{{ url_for('admin_incidents') }}" class="btn btn-sm btn-light rounded-pill px-3 fw-medium text-primary">
                    <i class="bi bi-arrow-left me-1"></i> Back to Incidents
                </a>
            </div>

            <!-- Body -->
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Incident Title <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control rounded-3 py-2" value="{{ incident.title if incident else '' }}" placeholder="e.g. Wi-Fi Access Point Malfunction in Hall B" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description & Incident Notes</label>
                        <textarea name="description" class="form-control rounded-3" rows="4" placeholder="Describe symptoms, impacted attendees/zones, and mitigation steps taken...">{{ incident.description if incident else '' }}</textarea>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Priority Level</label>
                            <select name="priority" class="form-select rounded-3 py-2">
                                <option value="low" {% if incident and incident.priority == 'low' %}selected{% endif %}>Low</option>
                                <option value="medium" {% if not incident or incident.priority == 'medium' %}selected{% endif %}>Medium</option>
                                <option value="high" {% if incident and incident.priority == 'high' %}selected{% endif %}>High</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Status</label>
                            <select name="status" class="form-select rounded-3 py-2">
                                <option value="open" {% if not incident or incident.status == 'open' %}selected{% endif %}>Open</option>
                                <option value="investigating" {% if incident and incident.status == 'investigating' %}selected{% endif %}>Investigating</option>
                                <option value="resolved" {% if incident and incident.status == 'resolved' %}selected{% endif %}>Resolved</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a href="{{ url_for('admin_incidents') }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-5 fw-semibold shadow-xs">
                            <i class="bi bi-check-lg me-1"></i> {{ 'Update Incident' if incident else 'Submit Incident' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
